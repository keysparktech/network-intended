! Command: show running-config
! device: switch3
!
no aaa root
!
username admin privilege 15 role network-admin secret sha512 $6$placeholder$hash
!
management api http-commands
   no shutdown
!
no service interface inactive port-id allocation disabled
!
service routing protocols model multi-agent
!
logging host 172.31.31.130
!
hostname switch3
!
snmp-server community public ro
snmp-server host 172.31.31.130 version 2c public
snmp-server enable traps
!
spanning-tree mode mstp
!
system l1
   unsupported speed action error
   unsupported error-correction action error
!
interface Ethernet1
   description 1000Mbps
   no switchport
!
interface Management1
   ip address 172.20.20.14/24
!
ip routing
!
ip route 172.31.31.130/32 172.20.20.1
!
management ssh
   authentication mode password
!
end