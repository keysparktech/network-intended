!
username admin privilege 15 role network-admin secret sha512 $6$placeholder$changeme
!
no aaa root
service routing protocols model multi-agent
!
logging vrf MGMT host 172.20.21.1logging trap informational
logging buffered 32768 informational
logging format timestamp high-resolution
logging on
!
hostname cr02-dthyd01
ip domain-name enterprise.local
!
ip name-server vrf MGMT 172.20.21.100
!
snmp-server view RO-VIEW iso included
snmp-server group GOLDEN v3 priv read RO-VIEW
snmp-server vrf MGMT local-interface Management1
snmp-server contact noc@enterprise.local
snmp-server location set-location
snmp-server enable traps
!
spanning-tree mode mstp
spanning-tree edge-port default
spanning-tree bpduguard default enable
!
management api http-commands
   no shutdown
   protocol https
   vrf MGMT
      no shutdown
!
aaa authentication login default group tacacs+ local
aaa authorization exec default group tacacs+ local
aaa authorization commands all default group tacacs+ local
aaa accounting exec default start-stop group tacacs+
aaa accounting commands all default start-stop group tacacs+
!
!
!
ip routing
!
!
ntp authenticate
ntp trusted-key 1
ntp server vrf MGMT 172.20.21.100 iburst
!
!
management ssh
   idle-timeout 15
   authentication mode password
   vrf MGMT
      no shutdown
!
end